name: Feature request / new module
description: Propose a new function, class, module, or improvement.
labels: ["enhancement"]
body:
  - type: dropdown
    id: target-module
    attributes:
      label: Target module
      description: Which planned or existing module does this belong to?
      options:
        - distributions (new distribution/method)
        - timeseries
        - gaussian_processes
        - copulas
        - survival
        - queueing
        - financial_stochastics
        - montecarlo
        - bayesian
        - statistics
        - numerical_methods
        - utils
        - CLI / packaging
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to compute, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API sketch
      description: |
        Constructor/method names and signatures. Distributions must fit the common interface
        (.pdf/.cdf/.ppf/.rvs/.mean/.var/.skewness/.kurtosis/.entropy/.mgf/.cf/.fit/.ks_test).
      placeholder: |
        from stochpylib.distributions import MyDist
        d = MyDist(a=1.0, b=2.0)
        d.pdf(0.5)
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Textbook/paper definitions of the formulas, existing implementations to cross-check against.
  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this and open a PR (see CONTRIBUTING.md)
