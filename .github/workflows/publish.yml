name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # verify the built wheel actually works before shipping it
      - run: python -m pip install dist/*.whl
      - run: spl --version
      - run: spl --test
      - name: Run every module demo against the installed wheel
        run: |
          for m in $(python -c "import stochpylib; print(' '.join(stochpylib.__all__))"); do
            spl demo "$m" || exit 1
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
