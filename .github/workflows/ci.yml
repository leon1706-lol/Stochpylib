name: CI

on:
  push:
  pull_request:

jobs:
  # Full suite on every supported interpreter and OS. fail-fast is off so one red cell
  # never cancels the other seven (development/Probleme.md #39, #52).
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" lifelines
      - run: pytest tests/ -v
      - name: Verify installed package
        run: |
          spl --version
          spl --test

  # One visible check per module: its oracle suite, its end-to-end API sweep (every
  # public name exercised), and its CLI surface. The matrix must list exactly
  # stochpylib.__all__ -- tests/docs/tests.py::test_ci_runs_one_smoke_job_per_module
  # enforces that.
  module-smoke:
    name: smoke (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - probability
          - distributions
          - montecarlo
          - timeseries
          - gaussian_processes
          - copulas
          - survival
          - queueing
          - information_theory
          - levy_processes
          - financial_stochastics
          - statistics
          - random_matrix
          - advanced_mcmc
          - numerical_methods
          - bayesian
          - robust_statistics
          - nonparametric
          - optimization
          - experimental_design
          - spatial_statistics
          - viz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit / oracle suite
        run: pytest tests/${{ matrix.module }}/tests.py -v
      - name: End-to-end API sweep
        run: pytest tests/${{ matrix.module }}/e2e.py -v
      - name: CLI surface
        run: |
          spl demo ${{ matrix.module }}
          python -c "import stochpylib.${{ matrix.module }} as m; print(len(m.__all__), 'public names')"

  # Optional backend: viz renders natively to SVG with no runtime dependency beyond
  # numpy/scipy; this job installs matplotlib and exercises the Figure.to_matplotlib()/
  # save('*.png'/'*.pdf') path the core jobs above never touch (they run with no
  # matplotlib installed, proving that path is truly optional).
  viz-matplotlib:
    name: viz (matplotlib backend)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" matplotlib
      - run: pytest tests/viz/backend_mpl.py -v
      - run: pytest tests/viz/tests.py tests/viz/e2e.py -v
      - run: spl demo viz

  # Cross-module conformance, documentation-consistency and CLI suites.
  cross-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/library tests/docs tests/cli -v

  # The built wheel must ship every spec name of every module.
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - name: Verify the wheel ships every subpackage and spec name
        run: |
          python - <<'EOF'
          import importlib, json
          spec = json.load(open("tests/library/_spec_names.json", encoding="utf-8"))
          import stochpylib
          missing = []
          for name in stochpylib.__all__:
              mod = importlib.import_module(f"stochpylib.{name}")
              missing += [f"{name}.{n}" for n in spec[name] if not hasattr(mod, n)]
          assert not missing, missing
          import statistics as stdlib_statistics
          assert stdlib_statistics is not stochpylib.statistics
          print(f"wheel ships {len(stochpylib.__all__)} modules, all spec names present")
          EOF
          spl --test
